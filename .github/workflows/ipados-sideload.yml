name: iPadOS sideload build

on:
  push:
    branches: [mac-test]
  workflow_dispatch:

# This workflow intentionally has no Apple credentials. It produces an arm64
# development IPA with an ad-hoc signature, which Sideloadly re-signs with the
# user's Apple Account before installing it on a device.
permissions:
  contents: read

jobs:
  build-ipados-ipa:
    # .NET for iOS 27.1 requires Xcode 27.1; this GitHub-hosted label tracks
    # the compatible Xcode 27 environment instead of macos-15's Xcode 16.4.
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Check out mac-test
        uses: actions/checkout@v4
        with:
          ref: mac-test

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402

      - name: Pin SDK for the workload set
        run: |
          printf '%s\n' '{"sdk":{"version":"10.0.402","rollForward":"disable"}}' > global.json
          dotnet --version

      - name: Select Xcode and record toolchain
        run: |
          xcode-select --print-path
          xcodebuild -version
          dotnet --info

      - name: Install pinned iOS workload
        run: |
          dotnet workload install ios --version 10.0.402.1
          dotnet workload list

      - name: Restore iPadOS project
        run: |
          set -o pipefail
          dotnet restore OpenUtau.iOS/OpenUtau.iOS.csproj --runtime ios-arm64 \
            2>&1 | tee restore.log

      - name: Publish device app and package re-signable IPA
        run: |
          set -o pipefail
          dotnet publish OpenUtau.iOS/OpenUtau.iOS.csproj \
            --configuration Release \
            --framework net10.0-ios \
            --runtime ios-arm64 \
            --self-contained true \
            -p:BuildIpa=true \
            -p:CodesignKey=- \
            -p:CodesignEntitlements=Entitlements.plist \
            2>&1 | tee publish.log

      - name: Locate and inspect IPA
        if: success()
        run: |
          output_root=OpenUtau.iOS/bin
          ipa=$(find "$output_root" -name '*.ipa' -type f -print -quit)
          mkdir -p artifacts
          if [ -z "$ipa" ]; then
            # Some .NET/iOS toolchain versions publish only the device .app.
            # An IPA is a ZIP whose top-level entry is Payload/<Application>.app.
            app=$(find "$output_root" -name '*.app' -type d -print -quit)
            if [ -z "$app" ]; then
              echo '::error::The iOS publish completed but produced neither an IPA nor an app bundle.'
              find "$output_root" -maxdepth 10 -print | sort
              exit 1
            fi
            package_dir=$(mktemp -d)
            mkdir -p "$package_dir/Payload"
            cp -R "$app" "$package_dir/Payload/"
            (
              cd "$package_dir"
              /usr/bin/zip -qry "$GITHUB_WORKSPACE/artifacts/OpenUtau-iPadOS-unsigned.ipa" Payload
            )
          else
            cp "$ipa" artifacts/OpenUtau-iPadOS-unsigned.ipa
          fi
          unzip -l artifacts/OpenUtau-iPadOS-unsigned.ipa | tee ipa-contents.log

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-iPadOS-unsigned
          path: artifacts/OpenUtau-iPadOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Summarize diagnostics
        if: always()
        run: |
          if [ -f publish.log ]; then
            tail -n 120 publish.log > publish-tail.log
            grep -E -i 'error |fatal|exception|failed|MT[0-9]+|IL[0-9]+' publish.log | tail -n 120 > publish-errors.log || true
          else
            printf '%s\n' 'publish.log was not created.' > publish-tail.log
            printf '%s\n' 'publish.log was not created.' > publish-errors.log
          fi
          {
            xcodebuild -version 2>&1 || true
            dotnet --info 2>&1 || true
          } > toolchain-summary.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipados-build-diagnostics
          path: |
            restore.log
            publish-tail.log
            publish-errors.log
            toolchain-summary.log
            ipa-contents.log
          if-no-files-found: warn
          retention-days: 7
